name: Deploy Smart Grocery to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Berikan izin ke GITHUB_TOKEN untuk men-deploy ke GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Batasi hanya 1 deployment bersamaan
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Static Web & PWA Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to Live Server (GitHub Pages)
        id: deployment
        uses: actions/deploy-pages@v4
