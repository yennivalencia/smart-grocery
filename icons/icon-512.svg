<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="cartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#064e3b" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Background subtle circles -->
  <circle cx="430" cy="90" r="140" fill="#ffffff" opacity="0.07" />
  <circle cx="80" cy="450" r="160" fill="#ffffff" opacity="0.05" />

  <!-- Shield Budget Backdrop in center -->
  <g filter="url(#shadow)">
    <!-- Main Trolley / Cart Body -->
    <path d="M120 140 H160 L195 295 C200 315 218 330 240 330 H360 C380 330 398 315 402 295 L425 180 H170" 
          fill="none" stroke="url(#cartGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Cart wheels -->
    <circle cx="230" cy="390" r="26" fill="#ffffff" />
    <circle cx="360" cy="390" r="26" fill="#ffffff" />
    <circle cx="230" cy="390" r="10" fill="#047857" />
    <circle cx="360" cy="390" r="10" fill="#047857" />

    <!-- Shield / Safety Badge inside Cart -->
    <path d="M300 130 C300 130 340 145 380 140 C380 200 345 250 300 270 C255 250 220 200 220 140 C260 145 300 130 300 130 Z" 
          fill="#f59e0b" stroke="#ffffff" stroke-width="8" />

    <!-- Centered Rp / Checkmark in Shield -->
    <text x="300" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="52" font-weight="900" fill="#ffffff" text-anchor="middle">Rp</text>
  </g>
</svg>

